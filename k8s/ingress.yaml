apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myingress
  namespace: nexora
spec:
  ingressClassName: nginx
  rules:
    - host: nexora.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc-front
                port:
                  number: 80
    